<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan Soal TKA – Bahasa Indonesia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap">
<style>
:root{--bg:#fff6e5;--bg2:#e6f3ff;--card:#fff;--ink:#2a2352;--mut:#6a6490;--pri:#7c4dff;--pk:#ff5fa2;--ok:#12a566;--okb:#e1f7ec;--no:#e5392c;--nob:#fdebe9;--md:#d17a00;--mdb:#fff1d6;--line:#e7e1f6;--tint:#f4f0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1535;--bg2:#10213f;--card:#241e45;--ink:#f1eeff;--mut:#aaa3d0;--ok:#3ddc97;--okb:#12382b;--no:#ff7a6e;--nob:#45201e;--md:#ffb547;--mdb:#40300f;--line:#3b3468;--tint:#2d2656}}
:root[data-theme="dark"]{--bg:#1a1535;--bg2:#10213f;--card:#241e45;--ink:#f1eeff;--mut:#aaa3d0;--ok:#3ddc97;--okb:#12382b;--no:#ff7a6e;--nob:#45201e;--md:#ffb547;--mdb:#40300f;--line:#3b3468;--tint:#2d2656}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;min-height:100vh;font:16px/1.6 Nunito,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:var(--bg2) linear-gradient(160deg,var(--bg),var(--bg2)) fixed}
#app{max-width:760px;margin:0 auto;padding:8px 14px 48px}
h1,h2,h3{font-family:"Baloo 2",Nunito,sans-serif;line-height:1.15;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px 0 6px;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(8px)}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--pk),#ffb020);transition:width .5s}
.meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:800}
.meta b{font:800 1.15rem "Baloo 2",sans-serif}.meta b span{color:var(--mut)}.meta .sp{flex:1}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:1px 12px}
.card{background:var(--card);border-radius:24px;padding:20px;border:2px solid var(--line);box-shadow:0 8px 0 var(--line);margin-top:14px}
.enter{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translateY(18px) scale(.96);opacity:0}}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pill{background:var(--c);color:#fff;border-radius:99px;padding:3px 12px;font-weight:800;font-size:.8rem}
.sub{font-size:.8rem;color:var(--mut);font-weight:700}
.ps{background:var(--tint);border-left:6px solid var(--pri);border-radius:14px;padding:10px 14px;margin:0 0 14px;font-size:.96rem}
.ps p{margin:.45em 0}.ps .lead{font-weight:800;color:var(--pri)}
.ps .pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;background:var(--card);border-radius:10px;padding:8px 12px;margin:.5em 0}
.sc{overflow-x:auto}.ps table{border-collapse:collapse;width:100%;margin:.5em 0}
.ps th,.ps td{border:2px solid var(--line);padding:6px 10px;text-align:left}.ps th{background:var(--card)}
.qt{font-weight:800;font-size:1.06rem;margin:6px 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:10px;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--pri)}
.opt .lb{flex:none;width:32px;height:32px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-weight:900;color:var(--pri)}
.opt em{margin-left:auto;font-style:normal;font-weight:900}
.opt.on{border-color:var(--pri);background:var(--tint)}.opt.on .lb{background:var(--pri);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok .lb{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--no);background:var(--nob)}.opt.bad .lb{background:var(--no);color:#fff}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.opt:disabled,.tf:disabled{cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:3px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.nm{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--pri);display:grid;place-items:center;font-weight:900}
.row .tx{flex:1 1 230px}.tfs{display:flex;gap:6px}
.tf{font:inherit;font-weight:800;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 14px;cursor:pointer}
.tf.on{background:var(--pri);border-color:var(--pri);color:#fff}.tf.key{outline:3px solid var(--ok)}
.row.ok{border-color:var(--ok);background:var(--okb)}.row.bad{border-color:var(--no);background:var(--nob)}
.kk{display:block;font-weight:800;font-size:.82rem;margin-top:4px}
.btn{font:800 1.1rem "Baloo 2",Nunito,sans-serif;border:0;border-radius:16px;padding:12px 22px;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pk));box-shadow:0 5px 0 #4b2bb8;cursor:pointer;width:100%;margin-top:6px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4b2bb8}.btn:disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--pri);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.react{display:flex;gap:14px;align-items:center;border-radius:18px;padding:12px 16px;margin:14px 0;animation:pop .5s}
.react .em{font-size:2.6rem;animation:bounce .8s}.react b{font:800 1.35rem "Baloo 2",sans-serif}.react p{margin:0;color:var(--ink)}
.react.good{background:var(--okb);color:var(--ok)}.react.mid{background:var(--mdb);color:var(--md)}.react.bad{background:var(--nob);color:var(--no)}
@keyframes bounce{0%,100%{transform:scale(1)}30%{transform:scale(1.45) rotate(-12deg)}60%{transform:scale(.9) rotate(8deg)}}
.hero{text-align:center}.mascot{font-size:5rem;line-height:1.2;animation:float 2.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.hero h1{font-size:2.4rem;background:linear-gradient(90deg,var(--pri),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.how{display:grid;gap:8px;text-align:left;margin:16px 0}.how div{background:var(--tint);border-radius:14px;padding:10px 14px}
.ring{--p:0;width:170px;height:170px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(var(--pri),var(--pk) calc(var(--p) * 1%),var(--line) 0)}
.ring>div{width:134px;height:134px;border-radius:50%;background:var(--card);display:grid;place-content:center}
.ring b{font:800 3.4rem "Baloo 2",sans-serif;line-height:1}.ring small{color:var(--mut);font-weight:700}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.badge{font-weight:800;font-size:.85rem;border-radius:99px;padding:4px 14px}
.badge.good{background:var(--okb);color:var(--ok)}.badge.mid{background:var(--mdb);color:var(--md)}.badge.bad{background:var(--nob);color:var(--no)}
.kb{text-align:left;margin:14px 0}.kb div{margin:8px 0}.kb small{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:.85rem}
.kb i{display:block;height:10px;border-radius:9px;background:var(--line);overflow:hidden}.kb u{display:block;height:100%;text-decoration:none;background:linear-gradient(90deg,var(--pri),var(--pk))}
.cta{display:grid;gap:10px;grid-template-columns:1fr 1fr}@media(max-width:480px){.cta{grid-template-columns:1fr}}
.filt{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.filt button{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 16px;cursor:pointer}
.filt button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.rv{border-left-width:8px;text-align:left}.rv.good{border-left-color:var(--ok)}.rv.mid{border-left-color:var(--md)}.rv.bad{border-left-color:var(--no)}
.rvh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font:800 1.25rem "Baloo 2",sans-serif}
.rv details{margin-bottom:12px}.rv summary{cursor:pointer;font-weight:800;color:var(--pri);margin-bottom:8px}
.exp{background:var(--tint);border-radius:16px;padding:12px 16px;margin-top:12px}.exp h3{color:var(--pri);font-size:1.2rem}
.keyline{font-weight:800}.exp .ind{color:var(--mut);font-size:.9rem;font-style:italic}
.exp ul,.exp ol{padding-left:22px;margin:.4em 0}.exp li{margin:.35em 0}.exp p{margin:.5em 0}
b.ok{color:var(--ok)}b.no{color:var(--no)}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.conf i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const Q=[{"id": 1, "type": "PG", "k": 1, "kt": "Pemahaman Tekstual", "sub": "1.1", "st": "Mengidentifikasi penggunaan kata serapan dari bahasa daerah/asing dalam berbagai bidang", "labels": ["A", "B", "C", "D", "E"], "opts": ["grafik – notifikasi", "aplikasi – efisien", "sensor – server", "efisien – server", "notifikasi – sensor"], "q": "Pasangan kata dalam teks yang sama-sama diserap dari bahasa asing <b>tanpa perubahan bentuk<\/b> (adopsi) adalah ….", "pass": "<p class=\"lead\">Bacalah teks berikut.<\/p><p>Perusahaan rintisan di bidang pertanian itu mengembangkan aplikasi yang membantu petani memantau kelembapan tanah. Data dari sensor dikirim ke server, dianalisis, lalu ditampilkan dalam bentuk grafik. Petani tidak perlu lagi menebak waktu menyiram; mereka cukup mengikuti notifikasi yang muncul di layar. Dengan cara itu, penggunaan air menjadi lebih efisien.<\/p>", "exp": "<p class=\"ind\">Indikator: membedakan kata serapan adopsi dan adaptasi berdasarkan perbandingan bentuk asli dan bentuk Indonesia.<\/p><p><i>Sensor<\/i> (dari <i>sensor<\/i>) dan <i>server<\/i> (dari <i>server<\/i>) dipakai dengan bentuk yang sama dengan bentuk asing asalnya, sehingga tergolong adopsi.<\/p><ul><li><b>A salah:<\/b> <i>grafik<\/i> (dari <i>graphic<\/i>) dan <i>notifikasi<\/i> (dari <i>notification<\/i>) berubah ejaan, jadi adaptasi.<\/li><li><b>B salah:<\/b> <i>aplikasi<\/i> (<i>application<\/i>) dan <i>efisien<\/i> (<i>efficient<\/i>) sama-sama adaptasi.<\/li><li><b>D salah:<\/b> <i>efisien<\/i> adaptasi, hanya <i>server<\/i> yang adopsi.<\/li><li><b>E salah:<\/b> <i>notifikasi<\/i> adaptasi, hanya <i>sensor<\/i> yang adopsi.<\/li><\/ul>", "ans": "C"}, {"id": 2, "type": "Benar-Salah", "k": 1, "kt": "Pemahaman Tekstual", "sub": "1.1", "st": "Mengidentifikasi penggunaan kata serapan dari bahasa daerah/asing dalam berbagai bidang", "opts": ["<i>Musyawarah<\/i> dan <i>mufakat<\/i> merupakan kata serapan dari bahasa asing di bidang pemerintahan.", "<i>Rendang<\/i> dan <i>gudeg<\/i> dapat dikelompokkan sebagai kata serapan dari bahasa daerah di bidang kuliner.", "<i>Kantor<\/i> dan <i>rekening<\/i> termasuk kata serapan dari bahasa daerah.", "<i>Unduh<\/i> termasuk kata serapan dari bahasa Inggris karena maknanya sama dengan <i>download<\/i>."], "labels": ["1", "2", "3", "4"], "q": "Tentukan <b>Benar<\/b> atau <b>Salah<\/b> untuk setiap pernyataan.", "pass": "<p class=\"lead\">Bacalah teks berikut.<\/p><p>Bahasa Indonesia terus memperkaya kosakatanya dari berbagai sumber. Di bidang pemerintahan, kata <i>musyawarah<\/i> dan <i>mufakat<\/i> diserap dari bahasa Arab, sedangkan <i>kantor<\/i> dan <i>rekening<\/i> diserap dari bahasa Belanda. Di bidang kuliner, <i>rendang<\/i> berasal dari bahasa Minangkabau dan <i>gudeg<\/i> dari bahasa Jawa. Sementara itu, di bidang teknologi, kata <i>unduh<\/i> diperkenalkan sebagai padanan kata <i>download<\/i>.<\/p>", "exp": "<p class=\"ind\">Indikator: mengelompokkan kata berdasarkan asal dan membedakan serapan dari padanan.<\/p><ol><li><b class=\"ok\">Benar.<\/b> Teks menyebut keduanya diserap dari bahasa Arab.<\/li><li><b class=\"ok\">Benar.<\/b> Teks menyebut asal dari bahasa Minangkabau dan Jawa (bahasa daerah).<\/li><li><b class=\"no\">Salah.<\/b> Teks menyebut keduanya dari bahasa Belanda (bahasa asing).<\/li><li><b class=\"no\">Salah.<\/b> Teks menyebut <i>unduh<\/i> sebagai <b>padanan<\/b> <i>download<\/i>, yaitu kata yang dibentuk dalam bahasa Indonesia, bukan diserap. Makna yang sama tidak menjadikannya serapan.<\/li><\/ol>", "ans": [true, true, false, false]}, {"id": 3, "type": "PG", "k": 1, "kt": "Pemahaman Tekstual", "sub": "1.2", "st": "Mengidentifikasi latar, karakter, dan/atau fenomena berdasarkan kosakata yang digunakan dalam teks fiksi atau nonfiksi", "labels": ["A", "B", "C", "D", "E"], "opts": ["pasar tradisional menjelang siang, ramai tetapi mulai lengang", "pasar tradisional pada dini hingga pagi hari, ramai dan sibuk", "pelabuhan pada malam hari, dengan suasana mencekam", "pasar swalayan modern pada pagi hari, tertib dan tenang", "kampung nelayan pada sore hari, dengan suasana tenteram"], "q": "Berdasarkan kosakata dalam kutipan tersebut, latar yang paling tepat adalah ….", "pass": "<p class=\"lead\">Bacalah kutipan cerpen berikut.<\/p><p>Sejak subuh, lorong Pasar Kemuning sudah riuh oleh tawar-menawar. Bau terasi, ikan asin, dan asap arang bercampur dengan aroma jeruk yang ditumpuk di atas karung goni. Bu Marni menyeka keringat dengan ujung kerudungnya, lalu kembali menata lapak dagangannya. Dari pengeras suara masjid, terdengar lantunan ayat suci yang perlahan tenggelam oleh deru sepeda motor pengangkut sayur.<\/p>", "exp": "<p class=\"ind\">Indikator: menentukan latar tempat, waktu, dan suasana berdasarkan kelompok kosakata.<\/p><p>Bukti: <i>Sejak subuh<\/i> (dini hari), <i>lorong pasar, tawar-menawar, lapak, karung goni<\/i> (pasar tradisional), <i>riuh<\/i> dan <i>deru sepeda motor<\/i> (ramai dan sibuk).<\/p><ul><li><b>A salah:<\/b> tidak ada petunjuk siang atau suasana lengang.<\/li><li><b>C salah:<\/b> teks tidak menyebut pelabuhan atau malam; suasana riuh, bukan mencekam.<\/li><li><b>D salah:<\/b> <i>tawar-menawar, lapak, karung goni<\/i> bertentangan dengan pasar swalayan.<\/li><li><b>E salah:<\/b> tidak ada petunjuk kampung nelayan; waktunya subuh dan suasananya riuh, bukan tenteram.<\/li><\/ul><p>Catatan: <i>ikan asin<\/i> tidak berarti latar nelayan, karena ikan asin lazim dijual di pasar.<\/p>", "ans": "B"}, {"id": 4, "type": "PGK", "k": 1, "kt": "Pemahaman Tekstual", "sub": "1.2", "st": "Mengidentifikasi latar, karakter, dan/atau fenomena berdasarkan kosakata yang digunakan dalam teks fiksi atau nonfiksi", "opts": ["Kata <i>rob<\/i> dan <i>air pasang<\/i> menunjukkan fenomena genangan akibat pasang laut.", "Kata <i>penurunan<\/i> tanah dan <i>pengambilan air tanah yang berlebihan<\/i> menunjukkan adanya faktor penyebab dari aktivitas manusia.", "Kata <i>abrasi<\/i> menunjukkan adanya pengikisan garis pantai.", "Kata <i>meninggikan lantai rumah<\/i> menunjukkan bahwa warga menganggap fenomena ini akan segera berakhir.", "Kata <i>tambak<\/i> menunjukkan bahwa sebagian besar warga bekerja sebagai petani padi."], "labels": ["1", "2", "3", "4", "5"], "q": "Pilihlah <b>semua<\/b> pernyataan yang benar tentang fenomena dalam teks berdasarkan kosakata yang digunakan.", "pass": "<p class=\"lead\">Bacalah teks berikut.<\/p><p>Banyak warga pesisir Demak kini menghadapi rob yang datang hampir setiap hari. Air pasang menggenangi permukiman hingga setinggi lutut, sementara tanah di bawahnya terus mengalami penurunan akibat pengambilan air tanah yang berlebihan. Abrasi menggerus garis pantai, tambak-tambak terendam, dan sebagian warga memilih meninggikan lantai rumah setiap beberapa tahun.<\/p>", "exp": "<p class=\"ind\">Indikator: menyimpulkan fenomena dari istilah khas.<\/p><ol><li><b class=\"ok\">Benar.<\/b> <i>Rob<\/i> dan <i>air pasang<\/i> menunjuk genangan akibat pasang laut.<\/li><li><b class=\"ok\">Benar.<\/b> <i>Pengambilan air tanah yang berlebihan<\/i> adalah aktivitas manusia yang disebut sebagai penyebab penurunan tanah.<\/li><li><b class=\"ok\">Benar.<\/b> <i>Abrasi<\/i> berarti pengikisan pantai, dan teks menyebut abrasi menggerus garis pantai.<\/li><li><b class=\"no\">Salah.<\/b> Warga meninggikan lantai <i>setiap beberapa tahun<\/i>. Ini menunjukkan masalah berulang dan berlanjut, bukan yang akan segera berakhir.<\/li><li><b class=\"no\">Salah.<\/b> <i>Tambak<\/i> adalah kolam budidaya ikan/udang, bukan sawah padi.<\/li><\/ol>", "ans": ["1", "2", "3"]}, {"id": 5, "type": "PG", "k": 1, "kt": "Pemahaman Tekstual", "sub": "1.3", "st": "Menyusun kerangka atau bagan berdasarkan bagian-bagian penting dalam teks", "labels": ["A", "B", "C", "D", "E"], "opts": ["I. Sampah makanan sebagai persoalan kota; II. Gas metana; III. Cairan lindi; IV. Pengomposan komunal", "I. Penyebab sampah makanan (rumah tangga, restoran, pasar); II. Dampak sampah makanan; III. Pengomposan; IV. Taman kota", "I. Sampah makanan sebagai persoalan kota; II. Dampak: metana dan lindi; III. Solusi: pengomposan dan taman kota; IV. Perubahan kebiasaan", "I. Sampah makanan sebagai persoalan kota; II. Dampak: metana, lindi, dan biaya; III. Upaya: pengomposan komunal; IV. Syarat efektif: perubahan kebiasaan warga", "I. Pengomposan komunal; II. Dampak sampah makanan; III. Sampah makanan sebagai persoalan kota; IV. Perubahan kebiasaan warga"], "q": "Kerangka yang paling tepat berdasarkan teks tersebut adalah ….", "pass": "<p class=\"lead\">Bacalah teks berikut.<\/p><p><b>(1)<\/b> Sampah makanan menjadi persoalan serius di kota besar. Setiap hari, ribuan ton sisa makanan dari rumah tangga, restoran, dan pasar berakhir di tempat pembuangan akhir.<\/p><p><b>(2)<\/b> Penumpukan sisa makanan menimbulkan tiga dampak utama. Pertama, timbunan sampah organik menghasilkan gas metana yang berkontribusi pada pemanasan global. Kedua, cairan lindi mencemari air tanah. Ketiga, biaya pengelolaan sampah membengkak.<\/p><p><b>(3)<\/b> Sejumlah kota mulai mengatasinya melalui pengomposan komunal. Warga memilah sisa dapur, lalu petugas mengolahnya menjadi kompos yang dipakai untuk taman kota.<\/p><p><b>(4)<\/b> Meskipun demikian, upaya ini belum efektif tanpa perubahan kebiasaan. Warga perlu membeli secukupnya dan menyimpan bahan makanan dengan benar agar tidak terbuang.<\/p>", "exp": "<p class=\"ind\">Indikator: menyusun kerangka yang lengkap, berurutan, dan bertingkat sesuai pola masalah–dampak–solusi.<\/p><p>D memuat empat poin utama sesuai empat paragraf, dan ketiga dampak (metana, lindi, biaya) dikelompokkan di bawah dampak.<\/p><ul><li><b>A salah:<\/b> dampak dipecah menjadi dua poin utama (meratakan tingkatan), dan poin kebiasaan warga hilang.<\/li><li><b>B salah:<\/b> teks tidak membahas penyebab; taman kota (rincian) dijadikan poin utama.<\/li><li><b>C salah:<\/b> dampak biaya hilang; taman kota bukan solusi, melainkan penggunaan kompos.<\/li><li><b>E salah:<\/b> urutan terbalik, sehingga pola teks rusak.<\/li><\/ul>", "ans": "D"}, {"id": 6, "type": "Benar-Salah", "k": 1, "kt": "Pemahaman Tekstual", "sub": "1.3", "st": "Menyusun kerangka atau bagan berdasarkan bagian-bagian penting dalam teks", "opts": ["Energi hidro dan energi gelombang tepat ditempatkan sebagai subbagian dari energi air.", "<i>Panel fotovoltaik<\/i> seharusnya dijadikan poin yang sejajar dengan energi surya (A).", "Kerangka tersebut sudah sesuai dengan pola teks, yaitu pengelompokan jenis energi berdasarkan sumbernya.", "<i>Indonesia<\/i> seharusnya ditambahkan sebagai poin utama IV karena disebut pada kalimat terakhir."], "labels": ["1", "2", "3", "4"], "q": "Tentukan <b>Benar<\/b> atau <b>Salah<\/b> untuk setiap pernyataan tentang kerangka tersebut.", "pass": "<p class=\"lead\">Bacalah teks berikut.<\/p><p>Berdasarkan sumbernya, energi terbarukan dibagi menjadi beberapa jenis. Energi surya memanfaatkan cahaya matahari melalui panel fotovoltaik. Energi angin memanfaatkan gerak udara untuk memutar turbin. Kelompok lain berasal dari air, yaitu energi hidro yang memanfaatkan aliran sungai dan energi gelombang yang memanfaatkan gerakan ombak. Terakhir, energi panas bumi memanfaatkan uap dari dalam bumi, yang banyak ditemukan di negara dengan gunung api aktif seperti Indonesia.<\/p><p>Berikut kerangka yang disusun seorang siswa.<\/p><div class=\"pre\">I. Energi terbarukan\n   A. Energi surya\n   B. Energi angin\n   C. Energi air\n       1. Energi hidro\n       2. Energi gelombang\n   D. Energi panas bumi<\/div>", "exp": "<p class=\"ind\">Indikator: menilai kesesuaian kerangka dengan pola klasifikasi dan tingkatan gagasan.<\/p><ol><li><b class=\"ok\">Benar.<\/b> Teks menyebut energi hidro dan gelombang sebagai “kelompok lain berasal dari air”.<\/li><li><b class=\"no\">Salah.<\/b> Panel fotovoltaik adalah cara kerja energi surya, jadi rincian, bukan jenis energi yang setingkat.<\/li><li><b class=\"ok\">Benar.<\/b> Teks diawali “berdasarkan sumbernya… dibagi menjadi beberapa jenis”, yang menandakan klasifikasi.<\/li><li><b class=\"no\">Salah.<\/b> <i>Indonesia<\/i> hanya contoh yang menjelaskan energi panas bumi, bukan gagasan utama tersendiri.<\/li><\/ol>", "ans": [true, false, true, false]}, {"id": 7, "type": "PG", "k": 2, "kt": "Pemahaman Inferensial", "sub": "2.1", "st": "Menyimpulkan ide pokok, gagasan pendukung, tokoh, peristiwa, latar, konflik, atau nilai-nilai dalam teks", "labels": ["A", "B", "C", "D", "E"], "opts": ["Kegagalan sebaiknya diterima begitu saja karena sudah menjadi takdir.", "Anak hendaknya meneruskan usaha yang telah dirintis orang tuanya.", "Beasiswa tidak sepenting pekerjaan yang langsung menghasilkan uang.", "Kegagalan hanya menimpa orang yang kurang bersungguh-sungguh berusaha.", "Kegigihan untuk bangkit setelah gagal lebih menentukan daripada keberuntungan."], "q": "Nilai yang paling tepat dapat disimpulkan dari kutipan tersebut adalah ….", "pass": "<p class=\"lead\">Bacalah kutipan cerpen berikut.<\/p><p>Ayah menyerahkan kunci bengkel itu tanpa banyak bicara. Sudah tiga hari Raka mengurung diri di kamar setelah pengumuman beasiswa tidak mencantumkan namanya.<\/p><p>“Kau kira aku tidak pernah gagal?” ujar Ayah sambil mengelap kunci pas yang berminyak. “Bengkel ini pernah bangkrut dua kali. Yang membuatnya berdiri bukan keberuntungan, melainkan aku yang membuka pintu lagi setiap pagi.”<\/p><p>Raka menatap kunci di tangannya. Untuk pertama kalinya sejak pengumuman itu, ia melangkah keluar kamar.<\/p>", "exp": "<p class=\"ind\">Indikator: menyimpulkan nilai dari perkataan dan perubahan sikap tokoh.<\/p><p>Ayah menegaskan bahwa bengkelnya berdiri bukan karena keberuntungan, melainkan karena ia bangkit dan membuka pintu lagi. Raka kemudian keluar kamar sebagai tanda ia mulai bangkit.<\/p><ul><li><b>A salah:<\/b> ayah justru menunjukkan usaha, bukan pasrah pada takdir.<\/li><li><b>B salah:<\/b> kunci bengkel adalah simbol, tetapi teks tidak mengajarkan bahwa anak wajib meneruskan usaha.<\/li><li><b>C salah:<\/b> teks tidak membandingkan beasiswa dan pekerjaan.<\/li><li><b>D salah:<\/b> ayah mengalami kegagalan dua kali meski berusaha; teks tidak menyebut kegagalan karena kurang usaha.<\/li><\/ul>", "ans": "E"}, {"id": 8, "type": "PGK", "k": 2, "kt": "Pemahaman Inferensial", "sub": "2.1", "st": "Menyimpulkan ide pokok, gagasan pendukung, tokoh, peristiwa, latar, konflik, atau nilai-nilai dalam teks", "opts": ["Ide pokok teks: bersepeda ke sekolah bermanfaat bagi siswa, tetapi memerlukan dukungan sarana.", "Melatih jantung dan otot kaki merupakan gagasan pendukung tentang manfaat kesehatan bersepeda.", "Seluruh siswa akan bersepeda apabila sekolah menyediakan parkir yang aman.", "Keselamatan pesepeda tidak menjadi masalah selama jarak ke sekolah pendek.", "Parkir yang aman dan jalur khusus disebut teks sebagai sarana pendukung kebiasaan bersepeda ke sekolah."], "labels": ["1", "2", "3", "4", "5"], "q": "Pilihlah <b>semua<\/b> simpulan yang benar berdasarkan teks.", "pass": "<p class=\"lead\">Bacalah teks berikut.<\/p><p>Bersepeda ke sekolah bukan sekadar pilihan gaya hidup. Bagi siswa, kebiasaan ini menyehatkan tubuh karena melatih jantung dan otot kaki secara rutin. Selain itu, jarak tempuh yang pendek tidak lagi dihabiskan dalam kemacetan, sehingga siswa tiba di sekolah dengan pikiran yang lebih segar. Di sisi lain, sekolah yang menyediakan tempat parkir sepeda yang aman terbukti mendorong lebih banyak siswa bersepeda. Namun, tanpa jalur khusus, keselamatan pesepeda tetap terancam.<\/p>", "exp": "<p class=\"ind\">Indikator: menyimpulkan ide pokok dan membedakannya dari gagasan pendukung, serta menghindari simpulan berlebihan.<\/p><ol><li><b class=\"ok\">Benar.<\/b> Manfaat kesehatan dan kesegaran pikiran, ditambah kebutuhan parkir dan jalur khusus, merangkum keseluruhan teks.<\/li><li><b class=\"ok\">Benar.<\/b> Kalimat itu merinci alasan manfaat kesehatan.<\/li><li><b class=\"no\">Salah.<\/b> Teks hanya menyebut parkir aman <i>mendorong lebih banyak<\/i> siswa, bukan <i>seluruh<\/i> siswa.<\/li><li><b class=\"no\">Salah.<\/b> Teks menyebut keselamatan tetap terancam tanpa jalur khusus, tanpa mengaitkannya dengan jarak.<\/li><li><b class=\"ok\">Benar.<\/b> Parkir aman dan jalur khusus memang disebut sebagai sarana pendukung dalam teks.<\/li><\/ol>", "ans": ["1", "2", "5"]}, {"id": 9, "type": "PG", "k": 2, "kt": "Pemahaman Inferensial", "sub": "2.2", "st": "Menjelaskan hubungan makna antarkalimat dan/atau antarparagraf dalam teks", "labels": ["A", "B", "C", "D", "E"], "opts": ["Kalimat (4) menjelaskan alasan terjadinya keadaan pada kalimat (3).", "Kalimat (4) menyatakan akibat dari keadaan pada kalimat (3).", "Kalimat (4) menambahkan contoh keberhasilan seperti pada kalimat (2).", "Kalimat (4) bertentangan dengan pernyataan pada kalimat (3).", "Kalimat (4) menyatakan syarat agar keadaan pada kalimat (3) terjadi."], "q": "Hubungan makna antara kalimat (3) dan kalimat (4) adalah ….", "pass": "<p class=\"lead\">Bacalah paragraf berikut.<\/p><p><b>(1)<\/b> Kota Wanasari menerapkan larangan kantong plastik sekali pakai sejak dua tahun lalu. (2) Setahun kemudian, sampah plastik di sungai kota itu turun cukup jauh. (3) Namun, penurunan tersebut tidak bertahan lama. (4) Ketika pasar tradisional kembali memakai kantong plastik tipis, volume sampah plastik kembali meningkat.<\/p>", "exp": "<p class=\"ind\">Indikator: menentukan hubungan makna dan arahnya antarkalimat.<\/p><p>Kalimat (3) menyatakan penurunan tidak bertahan lama. Kalimat (4) menjelaskan mengapa: pasar kembali memakai plastik dan sampah meningkat lagi.<\/p><ul><li><b>B salah:<\/b> arah dibalik. Kalimat (4) adalah penyebab, bukan akibat.<\/li><li><b>C salah:<\/b> kalimat (4) bukan contoh keberhasilan.<\/li><li><b>D salah:<\/b> kalimat (4) sejalan dengan (3); pertentangan justru ada antara (2) dan (3).<\/li><li><b>E salah:<\/b> tidak ada syarat (“jika…”).<\/li><\/ul>", "ans": "A"}, {"id": 10, "type": "Benar-Salah", "k": 2, "kt": "Pemahaman Inferensial", "sub": "2.2", "st": "Menjelaskan hubungan makna antarkalimat dan/atau antarparagraf dalam teks", "opts": ["Paragraf (2) menunjukkan bahwa anggapan pada paragraf (1) tidak sepenuhnya tepat.", "Paragraf (3) membatasi keberlakuan simpulan pada paragraf (2).", "Paragraf (3) membuktikan bahwa anggapan pada paragraf (1) sepenuhnya benar.", "Kata <i>Namun<\/i> pada paragraf (2) menunjukkan bahwa paragraf tersebut menambah alasan yang sejalan dengan paragraf (1)."], "labels": ["1", "2", "3", "4"], "q": "Tentukan <b>Benar<\/b> atau <b>Salah<\/b> untuk setiap pernyataan.", "pass": "<p class=\"lead\">Bacalah teks berikut.<\/p><p><b>(1)<\/b> Kopi sering dianggap minuman yang berbahaya bagi jantung. Anggapan itu bertahan puluhan tahun dan membuat banyak orang menghindarinya.<\/p><p><b>(2)<\/b> Namun, sejumlah penelitian terbaru menunjukkan gambaran yang lebih beragam. Konsumsi kopi dalam jumlah sedang tidak terbukti meningkatkan risiko penyakit jantung pada orang sehat.<\/p><p><b>(3)<\/b> Meskipun begitu, simpulan ini tidak berlaku bagi semua orang. Penderita gangguan irama jantung dan ibu hamil tetap dianjurkan membatasi konsumsi kafein sesuai saran dokter.<\/p>", "exp": "<p class=\"ind\">Indikator: menilai peran paragraf dalam rangkaian argumen.<\/p><ol><li><b class=\"ok\">Benar.<\/b> Paragraf (2) menyatakan gambaran lebih beragam dan risiko tidak terbukti meningkat.<\/li><li><b class=\"ok\">Benar.<\/b> Paragraf (3) menyebut simpulan tidak berlaku bagi semua orang.<\/li><li><b class=\"no\">Salah.<\/b> Paragraf (3) hanya membatasi kelompok tertentu; tidak membuktikan anggapan awal benar sepenuhnya.<\/li><li><b class=\"no\">Salah.<\/b> <i>Namun<\/i> menandai pertentangan, bukan penambahan alasan yang sejalan.<\/li><\/ol>", "ans": [true, true, false, false]}, {"id": 11, "type": "PG", "k": 2, "kt": "Pemahaman Inferensial", "sub": "2.3", "st": "Memprediksi lanjutan atau akhir uraian/cerita berdasarkan bagian tertentu dalam teks", "labels": ["A", "B", "C", "D", "E"], "opts": ["sekolah sebaiknya menghapus seluruh proyek kelompok karena terbukti gagal", "siswa lebih baik kembali pada tugas hafalan secara penuh", "guru perlu merancang penilaian yang memantau kontribusi tiap anggota kelompok", "pembagian tugas akan merata dengan sendirinya seiring berjalannya waktu", "kegiatan diskusi siswa perlu dikurangi supaya pekerjaan terbagi lebih adil"], "q": "Lanjutan yang paling logis untuk kutipan tersebut adalah ….", "pass": "<p class=\"lead\">Bacalah kutipan teks berikut.<\/p><p>Beberapa sekolah menengah mulai mengurangi tugas rumah berbentuk hafalan dan menggantinya dengan proyek kelompok. Hasil awalnya menggembirakan: siswa lebih aktif berdiskusi dan lebih mampu menjelaskan konsep dengan kata-katanya sendiri. Meskipun demikian, guru menemukan bahwa pembagian tugas dalam kelompok sering tidak merata; beberapa siswa mengerjakan hampir seluruh pekerjaan, sedangkan yang lain hanya menumpang nama. Karena itu, ….<\/p>", "exp": "<p class=\"ind\">Indikator: memprediksi lanjutan yang menjawab masalah terakhir dalam uraian.<\/p><p>Masalah terakhir: pembagian tugas tidak merata. Penanda <i>Karena itu<\/i> menuntut tindakan yang menanggapi masalah tersebut, yaitu penilaian yang memantau kontribusi.<\/p><ul><li><b>A salah:<\/b> terlalu ekstrem; hasil awal proyek justru menggembirakan.<\/li><li><b>B salah:<\/b> mengabaikan manfaat yang sudah disebut.<\/li><li><b>D salah:<\/b> tidak ada dasar bahwa masalah selesai sendiri, dan tidak menanggapi <i>Karena itu<\/i>.<\/li><li><b>E salah:<\/b> mengorbankan manfaat diskusi dan tidak menyasar masalah pembagian tugas.<\/li><\/ul>", "ans": "C"}, {"id": 12, "type": "PGK", "k": 2, "kt": "Pemahaman Inferensial", "sub": "2.3", "st": "Memprediksi lanjutan atau akhir uraian/cerita berdasarkan bagian tertentu dalam teks", "labels": ["A", "B", "C", "D", "E"], "opts": ["Ia kembali mencari alasan untuk menunda, dan sebagian besar waktunya habis untuk hal lain.", "Ia baru mulai menulis dengan tergesa-gesa ketika waktu hampir habis.", "Ia menyelesaikan naskahnya dengan tenang dan matang sebelum tengah malam.", "Ia memenangkan lomba karena naskahnya paling orisinal.", "Ia menyerahkan naskah tepat waktu karena selama ini tidak pernah menunda."], "q": "Pilihlah <b>semua<\/b> prediksi kelanjutan cerita yang didukung petunjuk dalam kutipan. Nilailah setiap prediksi secara terpisah.", "pass": "<p class=\"lead\">Bacalah kutipan cerpen berikut.<\/p><p>Nadia sudah tiga kali menunda menyerahkan naskah lomba menulis. Setiap kali tenggat mendekat, ia selalu punya alasan: laptop bermasalah, ide belum datang, atau hujan terlalu deras. Malam ini tenggat tinggal enam jam lagi. Ia membuka dokumen kosong, menatap kursor yang berkedip, lalu mengambil ponsel dan mulai menggulir video. ….<\/p>", "exp": "<p class=\"ind\">Indikator: memprediksi akhir cerita berdasarkan watak dan pola tindakan tokoh.<\/p><ul><li><b>A benar:<\/b> pola menunda dan mencari alasan berulang, dan tokoh baru saja beralih ke ponsel.<\/li><li><b>B benar:<\/b> sikap menunda mendorong penyelesaian mepet tenggat.<\/li><li><b>C salah:<\/b> bertentangan dengan pola menunda yang berulang.<\/li><li><b>D salah:<\/b> tidak ada petunjuk tentang hasil lomba maupun orisinalitas.<\/li><li><b>E salah:<\/b> bertentangan langsung dengan fakta bahwa ia sudah tiga kali menunda.<\/li><\/ul>", "ans": ["A", "B"]}, {"id": 13, "type": "PG", "k": 3, "kt": "Evaluasi dan Apresiasi", "sub": "3.1", "st": "Menilai relevansi peristiwa dalam teks dengan kehidupan sehari-hari", "labels": ["A", "B", "C", "D", "E"], "opts": ["sebuah warung mengecilkan porsi makanan tanpa pemberitahuan agar harga jual tidak berubah", "sebuah toko menambah jam buka agar jumlah pelanggan yang datang meningkat", "sebuah toko pakaian memberikan potongan harga menjelang akhir tahun", "seorang siswa menyontek agar nilai ulangannya tidak turun", "sebuah warung menaikkan harga sedikit dan menjelaskan alasannya, bukan menurunkan mutu diam-diam"], "q": "Situasi yang paling relevan dengan peristiwa dalam kutipan tersebut dalam kehidupan sehari-hari adalah ….", "pass": "<p class=\"lead\">Bacalah kutipan teks berikut.<\/p><p>Harga daging sapi naik dua bulan berturut-turut. Pak Darsa, pedagang bakso gerobak, memilih menaikkan harga seribu rupiah per porsi dan memasang pengumuman di gerobaknya yang menjelaskan alasannya, ketimbang mencampur adonan dengan lebih banyak tepung. Sebulan kemudian, beberapa pelanggan mengeluh, tetapi sebagian besar tetap datang.<\/p>", "exp": "<p class=\"ind\">Indikator: menilai relevansi berdasarkan kesamaan inti masalah dan pilihan.<\/p><p>Inti peristiwa: menghadapi kenaikan biaya, memilih transparan (harga naik dan dijelaskan) dibanding menurunkan mutu diam-diam. Opsi E memiliki pola yang sama.<\/p><ul><li><b>A salah:<\/b> pola berlawanan (mengurangi diam-diam), meski situasi sama-sama soal harga.<\/li><li><b>B dan C salah:<\/b> tentang strategi penjualan, tidak menyangkut transparansi atas kenaikan biaya.<\/li><li><b>D salah:<\/b> tentang kejujuran, tetapi konteks dan pilihan berbeda; pada peristiwa tidak ada tindakan curang tokoh.<\/li><\/ul>", "ans": "E"}, {"id": 14, "type": "Benar-Salah", "k": 3, "kt": "Evaluasi dan Apresiasi", "sub": "3.1", "st": "Menilai relevansi peristiwa dalam teks dengan kehidupan sehari-hari", "opts": ["Peristiwa itu relevan bagi lingkungan lain karena masalah sampah dan pemberian insentif juga dijumpai di banyak tempat.", "Peristiwa itu tidak relevan dengan kehidupan sehari-hari karena hanya terjadi di sekolah.", "Keluhan pengurus relevan karena menunjukkan tantangan yang lazim dalam program yang bergantung pada partisipasi warga.", "Peristiwa itu baru relevan jika seluruh siswa berpartisipasi penuh."], "labels": ["1", "2", "3", "4"], "q": "Tentukan <b>Benar<\/b> atau <b>Salah<\/b> untuk setiap penilaian tentang relevansi peristiwa dalam teks dengan kehidupan sehari-hari.", "pass": "<p class=\"lead\">Bacalah teks berikut.<\/p><p>Lima siswa SMA menggagas bank sampah di sekolah mereka. Setiap Jumat, siswa menukar botol plastik dengan poin yang dapat dipakai untuk membeli alat tulis di koperasi sekolah. Dalam tiga bulan, terkumpul 120 kilogram plastik, dan koperasi mencatat kenaikan jumlah pengunjung. Namun, pengurus mengeluhkan bahwa tidak semua siswa mau memilah sampah sehingga botol kotor menumpuk.<\/p>", "exp": "<p class=\"ind\">Indikator: menilai keterkaitan peristiwa dengan kehidupan nyata melalui inti masalah.<\/p><ol><li><b class=\"ok\">Benar.<\/b> Masalah sampah dan penggunaan insentif memang ditemukan di banyak lingkungan.<\/li><li><b class=\"no\">Salah.<\/b> Relevansi ditentukan oleh inti masalah, bukan oleh tempat kejadian.<\/li><li><b class=\"ok\">Benar.<\/b> Tantangan partisipasi (tidak semua mau memilah) lazim dalam program bersama.<\/li><li><b class=\"no\">Salah.<\/b> Relevansi tidak bergantung pada partisipasi penuh; kekurangan partisipasi justru bagian dari kenyataan yang relevan.<\/li><\/ol>", "ans": [true, false, true, false]}, {"id": 15, "type": "PG", "k": 3, "kt": "Evaluasi dan Apresiasi", "sub": "3.2", "st": "Menilai keakuratan, kesesuaian, kecukupan, atau ketepatan informasi dalam teks", "labels": ["A", "B", "C", "D", "E"], "opts": ["Klaim penurunan durasi membaca tidak akurat karena hanya berdasarkan rata-rata.", "Klaim penurunan durasi membaca didukung data, tetapi klaim penyebabnya belum cukup didukung karena tabel tidak memuat alasan siswa.", "Kedua klaim sudah cukup didukung karena penurunan terjadi secara konsisten pada tiga tingkat kelas.", "Kedua klaim tidak dapat dipakai sama sekali karena survei hanya dilakukan di satu sekolah.", "Klaim penyebab lebih kuat daripada klaim penurunan karena tugas di kelas XII memang lebih banyak."], "q": "Penilaian yang paling tepat terhadap pernyataan siswa tersebut adalah ….", "pass": "<p class=\"lead\">Bacalah informasi berikut.<\/p><p>Survei di SMA Nusantara melibatkan 60 siswa dari tiap tingkat kelas. Survei hanya mencatat lama membaca buku nonpelajaran dan tidak menanyakan alasan siswa.<\/p><div class=\"sc\"><table><tr><th><b>Tingkat kelas<\/b><\/th><th><b>Rata-rata waktu baca per minggu<\/b><\/th><\/tr><tr><td>X<\/td><td>3 jam<\/td><\/tr><tr><td>XI<\/td><td>2 jam<\/td><\/tr><tr><td>XII<\/td><td>1,5 jam<\/td><\/tr><\/table><\/div><p>Seorang siswa menulis: “Makin tinggi kelas, makin sedikit siswa membaca. Ini pasti karena tugas sekolah yang menumpuk.”<\/p>", "exp": "<p class=\"ind\">Indikator: menilai kecukupan bukti, dengan membedakan pola dan sebab.<\/p><p>Tabel menunjukkan penurunan rata-rata waktu baca dari X ke XII, jadi klaim pertama didukung. Survei tidak menanyakan alasan siswa, sehingga klaim “pasti karena tugas sekolah” tidak cukup didukung.<\/p><ul><li><b>A salah:<\/b> rata-rata adalah ringkasan sah untuk menyatakan pola.<\/li><li><b>C salah:<\/b> konsistensi pola tidak membuktikan sebab.<\/li><li><b>D salah:<\/b> keterbatasan satu sekolah membatasi generalisasi, bukan menghapus nilai data untuk sekolah itu.<\/li><li><b>E salah:<\/b> memakai asumsi di luar data.<\/li><\/ul>", "ans": "B"}, {"id": 16, "type": "PGK", "k": 3, "kt": "Evaluasi dan Apresiasi", "sub": "3.2", "st": "Menilai keakuratan, kesesuaian, kecukupan, atau ketepatan informasi dalam teks", "opts": ["Jumlah siswa yang mengikuti setidaknya satu lomba adalah 132 siswa.", "Pernyataan “hampir seluruh siswa” kurang akurat karena siswa yang berpartisipasi baru sekitar 55%.", "Jumlah siswa peserta lomba adalah 156 siswa, sehingga pernyataan panitia sudah akurat.", "Pernyataan panitia akurat karena jumlah peserta lomba menulis saja sudah lebih dari sepertiga jumlah siswa.", "Laporan cukup untuk menentukan jumlah siswa yang hanya mengikuti lomba menulis, yaitu 72 siswa."], "labels": ["1", "2", "3", "4", "5"], "q": "Pilihlah <b>semua<\/b> penilaian yang benar terhadap informasi dalam laporan tersebut.", "pass": "<p class=\"lead\">Bacalah laporan berikut.<\/p><p>Panitia Pekan Literasi melaporkan bahwa dari 240 siswa kelas XII, 96 siswa mengikuti lomba menulis, 60 siswa mengikuti lomba baca puisi, dan 24 siswa mengikuti kedua lomba tersebut (siswa yang mengikuti keduanya dihitung pada kedua jumlah di atas). Berdasarkan laporan itu, panitia menulis: “Hampir seluruh siswa kelas XII berpartisipasi dalam Pekan Literasi.”<\/p>", "exp": "<p class=\"ind\">Indikator: memeriksa keakuratan angka dan menghindari penghitungan ganda.<\/p><p>Peserta setidaknya satu lomba = 96 + 60 − 24 = 132 siswa; 132 : 240 = 55%.<\/p><ol><li><b class=\"ok\">Benar.<\/b> (perhitungan di atas).<\/li><li><b class=\"ok\">Benar.<\/b> 55% sedikit lebih dari separuh, tidak cukup untuk “hampir seluruh”.<\/li><li><b class=\"no\">Salah.<\/b> 156 menghitung ganda 24 siswa.<\/li><li><b class=\"no\">Salah.<\/b> Alasan 96 &gt; sepertiga benar sendiri (40%), tetapi tidak membuktikan pernyataan bahwa hampir seluruh siswa berpartisipasi.<\/li><li><b class=\"ok\">Benar.<\/b> Hanya lomba menulis = 96 − 24 = 72.<\/li><\/ol>", "ans": ["1", "2", "5"]}, {"id": 17, "type": "PG", "k": 3, "kt": "Evaluasi dan Apresiasi", "sub": "3.3", "st": "Menilai ketepatan dan kesesuaian penggunaan bahasa dalam teks", "labels": ["A", "B", "C", "D", "E"], "opts": ["Kami berharap Bapak berkenan memberikan balasan sesegera mungkin.", "Kalau bisa, kami tunggu balasan Bapak secepatnya.", "Mohon balasannya secepatnya ya, Pak.", "Kalo Bapak berkenan, kami menunggu jawaban Bapak.", "Kami menunggu-nunggu balasan Bapak dengan segera sekali."], "q": "Perbaikan yang paling tepat untuk kalimat (4) agar sesuai dengan situasi surel tersebut adalah ….", "pass": "<p class=\"lead\">Bacalah surel berikut.<\/p><p><b>(1)<\/b> Yth. Bapak Kepala SMA Cendana,<\/p><p><b>(2)<\/b> Kami, pengurus OSIS, bermaksud memohon izin menggunakan aula sekolah untuk menyelenggarakan bazar pada 15 November 2026.<\/p><p><b>(3)<\/b> Kegiatan tersebut bertujuan menggalang dana bagi korban banjir.<\/p><p><b>(4)<\/b> Kalo bisa, kami tunggu balasan Bapak secepatnya ya.<\/p><p><b>(5)<\/b> Atas perhatian Bapak, kami ucapkan terima kasih.<\/p>", "exp": "<p class=\"ind\">Indikator: menilai kesesuaian ragam bahasa dengan situasi resmi dan menentukan revisi tepat.<\/p><p>Kalimat (4) mencampurkan ragam santai (<i>Kalo<\/i>, <i>ya<\/i>) dalam surel resmi kepada kepala sekolah. Revisi A baku, sopan, dan makna tetap.<\/p><ul><li><b>B salah:<\/b> <i>Kalau bisa<\/i> dan <i>secepatnya<\/i> masih kurang resmi dan tidak sopan bagi kepala sekolah.<\/li><li><b>C salah:<\/b> <i>ya, Pak<\/i> bersifat lisan.<\/li><li><b>D salah:<\/b> masih memuat <i>Kalo<\/i> (nonbaku).<\/li><li><b>E salah:<\/b> <i>menunggu-nunggu … segera sekali<\/i> janggal dan tidak baku.<\/li><\/ul>", "ans": "A"}, {"id": 18, "type": "Benar-Salah", "k": 3, "kt": "Evaluasi dan Apresiasi", "sub": "3.3", "st": "Menilai ketepatan dan kesesuaian penggunaan bahasa dalam teks", "opts": ["Kalimat (A) tidak efektif karena <i>para<\/i> dan bentuk ulang <i>siswa-siswa<\/i> sama-sama menyatakan jamak.", "Kalimat (B) efektif karena memiliki subjek, predikat, dan objek yang jelas serta tidak memuat kata mubazir.", "Kalimat (C) efektif karena diawali kata depan <i>Kepada<\/i> sehingga terdengar lebih sopan.", "Perbaikan yang tepat untuk kalimat (C) adalah menghilangkan kata <i>Kepada<\/i> agar kalimat memiliki subjek."], "labels": ["1", "2", "3", "4"], "q": "Tentukan <b>Benar<\/b> atau <b>Salah<\/b> untuk setiap pernyataan.", "pass": "<p class=\"lead\">Bacalah kalimat-kalimat dari buletin sekolah berikut.<\/p><p><b>(A)<\/b> Para siswa-siswa kelas XII mengikuti simulasi TKA di aula.<\/p><p><b>(B)<\/b> Panitia membagikan lembar jawaban sebelum simulasi dimulai.<\/p><p><b>(C)<\/b> Kepada peserta yang sudah selesai dipersilakan meninggalkan ruangan.<\/p>", "exp": "<p class=\"ind\">Indikator: menilai keefektifan kalimat.<\/p><ol><li><b class=\"ok\">Benar.<\/b> Pleonasme: dua penanda jamak untuk satu kata.<\/li><li><b class=\"ok\">Benar.<\/b> Panitia (S) – membagikan (P) – lembar jawaban (O), tanpa kata mubazir.<\/li><li><b class=\"no\">Salah.<\/b> Kata depan di awal menyebabkan kalimat tidak bersubjek; kesopanan bukan alasan keefektifan.<\/li><li><b class=\"ok\">Benar.<\/b> Setelah <i>Kepada<\/i> dihilangkan, <i>peserta yang sudah selesai<\/i> menjadi subjek.<\/li><\/ol>", "ans": [true, true, false, true]}, {"id": 19, "type": "PG", "k": 3, "kt": "Evaluasi dan Apresiasi", "sub": "3.4", "st": "Menilai ketepatan bagian teks untuk menggambarkan karakter, peristiwa, atau latar dalam teks fiksi", "labels": ["A", "B", "C", "D", "E"], "opts": ["“Bu Lastri dikenal galak.”", "“menyuruh siswa mengulang tugas yang dikerjakan asal-asalan”", "“menunggu di gerbang sekolah sampai siswa terakhir dijemput”", "“memberikan payungnya kepada Doni, lalu berjalan pulang dengan tas di atas kepala”", "“pada suatu sore hujan”"], "q": "Bagian teks yang paling tepat untuk menggambarkan kepedulian Bu Lastri yang <b>rela berkorban<\/b> adalah ….", "pass": "<p class=\"lead\">Bacalah kutipan cerpen berikut.<\/p><p>Bu Lastri dikenal galak. Di kelas, ia tidak segan menyuruh siswa mengulang tugas yang dikerjakan asal-asalan. Namun, pada suatu sore hujan, Bu Lastri menunggu di gerbang sekolah sampai siswa terakhir dijemput. Ia bahkan memberikan payungnya kepada Doni, lalu berjalan pulang dengan tas di atas kepala.<\/p>", "exp": "<p class=\"ind\">Indikator: menimbang bagian teks yang paling kuat untuk menunjukkan watak spesifik (peduli dan rela berkorban).<\/p><p>Bagian D menunjukkan pengorbanan: ia memberikan payungnya dan berjalan pulang kehujanan.<\/p><ul><li><b>A dan B<\/b> menggambarkan sisi tegas, bukan kepedulian.<\/li><li>C menunjukkan kepedulian dan tanggung jawab, tetapi tidak menunjukkan pengorbanan.<\/li><li>E hanya keterangan waktu/cuaca.<\/li><\/ul>", "ans": "D"}, {"id": 20, "type": "PGK", "k": 3, "kt": "Evaluasi dan Apresiasi", "sub": "3.4", "st": "Menilai ketepatan bagian teks untuk menggambarkan karakter, peristiwa, atau latar dalam teks fiksi", "opts": ["“gonggongan anjing berhenti mendadak”", "“lampu minyak berkedip-kedip meski tidak ada angin”", "“papan lantai yang sesekali berderit sendiri”", "“rumah panggung di tepi sungai”", "“menyarungkan kain ke bahunya”"], "labels": ["1", "2", "3", "4", "5"], "q": "Pengarang ingin menggambarkan suasana yang <b>mencekam<\/b>. Pilihlah <b>semua<\/b> bagian yang tepat untuk menggambarkan suasana tersebut.", "pass": "<p class=\"lead\">Bacalah kutipan cerpen berikut.<\/p><p>Malam itu, rumah panggung di tepi sungai terasa lebih sunyi daripada biasanya. Lampu minyak berkedip-kedip meski tidak ada angin. Di luar, gonggongan anjing berhenti mendadak, meninggalkan sunyi yang menekan dan papan lantai yang sesekali berderit sendiri. Sari menyarungkan kain ke bahunya dan duduk tanpa bergerak.<\/p>", "exp": "<p class=\"ind\">Indikator: menilai detail yang membangun suasana mencekam.<\/p><ol><li><b class=\"ok\">Benar.<\/b> Kesunyian mendadak menciptakan ketegangan.<\/li><li><b class=\"ok\">Benar.<\/b> Lampu berkedip tanpa angin memberi kesan janggal.<\/li><li><b class=\"ok\">Benar.<\/b> Bunyi lantai sendiri menegaskan keganjilan.<\/li><li><b class=\"no\">Salah.<\/b> Keterangan tempat yang netral; belum membangun kesan tertentu.<\/li><li><b class=\"no\">Salah.<\/b> Keterangan pakaian yang tidak menunjukkan ketegangan.<\/li><\/ol>", "ans": ["1", "2", "3"]}, {"id": 21, "type": "PG", "k": 3, "kt": "Evaluasi dan Apresiasi", "sub": "3.5", "st": "Menyimpulkan respons emosional terhadap unsur puisi, prosa, dan drama", "labels": ["A", "B", "C", "D", "E"], "opts": ["kesal, karena ibu terlalu banyak mengatur si aku", "haru, karena kasih sayang ibu terasa dalam tindakan kecil dan tangan yang tertinggal di udara", "lega, karena perpisahan si aku dan ibu akhirnya terjadi", "bangga, karena si aku berhasil mencapai cita-citanya", "riang, karena si aku akan memulai perjalanan yang menyenangkan"], "q": "Respons emosional pembaca yang paling tepat terhadap puisi tersebut adalah ….", "pass": "<p class=\"lead\">Bacalah puisi berikut.<\/p><p><b>Ibu di Stasiun<\/b><\/p><p>Peron pukul lima; peluit memanjang.<br>Koper kecilku digandengnya erat.<br>“Jaga perut,” katanya, sambil terus<br>merapikan kerah yang sudah rapi.<br>Kereta bergerak. Ia tak melambai—<br>hanya tangan yang lama tertinggal di udara.<\/p>", "exp": "<p class=\"ind\">Indikator: menyimpulkan respons emosional dari tindakan kecil dan citraan.<\/p><p>Tindakan <i>menggandeng erat<\/i>, <i>merapikan kerah yang sudah rapi<\/i>, dan <i>tangan yang lama tertinggal di udara<\/i> menunjukkan kasih dan berat hati berpisah. Pembaca terhubung secara haru.<\/p><ul><li><b>A salah:<\/b> mengartikan perhatian sebagai pengekangan, padahal <i>kerah yang sudah rapi<\/i> menunjukkan kasih, bukan kontrol.<\/li><li><b>C salah:<\/b> tidak ada petunjuk lega.<\/li><li><b>D salah:<\/b> puisi tidak membahas pencapaian.<\/li><li><b>E salah:<\/b> bertentangan dengan suasana perpisahan.<\/li><\/ul>", "ans": "B"}, {"id": 22, "type": "Benar-Salah", "k": 3, "kt": "Evaluasi dan Apresiasi", "sub": "3.5", "st": "Menyimpulkan respons emosional terhadap unsur puisi, prosa, dan drama", "opts": ["Kutipan dapat menimbulkan rasa haru karena perhatian Nenek muncul bersamaan dengan kerinduannya kepada Kakek.", "Petunjuk lakuan “Kursi goyang berhenti berayun” memperkuat kesan sunyi dan sedih pada adegan tersebut.", "Kutipan menimbulkan rasa geli karena Nenek bermaksud melucu dengan menyebut Kakek.", "Pembaca seharusnya merasa kesal pada Cucu karena ia hanya menjawab singkat."], "labels": ["1", "2", "3", "4"], "q": "Tentukan <b>Benar<\/b> atau <b>Salah<\/b> untuk setiap pernyataan tentang respons emosional terhadap kutipan tersebut.", "pass": "<p class=\"lead\">Bacalah kutipan naskah drama berikut.<\/p><p><i>(Rumah tua, senja. NENEK duduk di kursi goyang sambil memegang sebuah foto. CUCU masuk membawa koper.)<\/i><\/p><p><b>CUCU:<\/b> Nek, taksinya sudah menunggu.<br><b>NENEK:<\/b> <i>(tanpa menoleh)<\/i> Sudah kamu bawa jaket? Di sana dingin.<br><b>CUCU:<\/b> Sudah, Nek.<br><b>NENEK:<\/b> <i>(menyelipkan selembar uang lusuh ke saku Cucu)<\/i> Jangan bilang Kakek … <i>(berhenti, tersenyum getir)<\/i> Ah, Kakekmu kan sudah lama tidak di sini.<br><i>(CUCU terdiam. Kursi goyang berhenti berayun.)<\/i><\/p>", "exp": "<p class=\"ind\">Indikator: menyimpulkan respons emosional dari dialog dan petunjuk lakuan.<\/p><ol><li><b class=\"ok\">Benar.<\/b> Perhatian Nenek dan pengakuan Kakek sudah tiada menghasilkan rasa haru.<\/li><li><b class=\"ok\">Benar.<\/b> Petunjuk lakuan <i>kursi goyang berhenti<\/i> menandai hening yang sedih.<\/li><li><b class=\"no\">Salah.<\/b> <i>Tersenyum getir<\/i> menandai luka, bukan lelucon.<\/li><li><b class=\"no\">Salah.<\/b> <i>Cucu terdiam<\/i> menandakan ia terharu; jawaban singkat tidak berarti tidak peduli.<\/li><\/ol>", "ans": [true, true, false, false]}],N=Q.length,$=s=>document.querySelector(s),app=$('#app');
const TY={PG:['Pilihan Ganda','#7c4dff'],PGK:['Pilihan Ganda Kompleks','#f26b1d'],'Benar-Salah':['Benar / Salah','#0891d1']};
const MSG={good:[['🎉','Hebat!'],['🌟','Keren banget!'],['🚀','Mantap, tepat sekali!'],['🏅','Juara!']],mid:[['👍','Hampir sempurna!'],['🤔','Lumayan, sedikit lagi!']],bad:[['😅','Ups, belum tepat!'],['💪','Semangat, jangan menyerah!'],['🌱','Yuk, belajar dari ini!']]};
const pick=a=>a[Math.random()*a.length|0];
let S;
const init=()=>{S={scr:'start',i:0,streak:0,f:'all',a:{}};Q.forEach(q=>S.a[q.id]={sel:q.type==='PG'?null:q.type==='PGK'?[]:q.opts.map(()=>null),done:false,s:0})};
const score=(q,x)=>q.type==='PG'?+(x===q.ans):q.type==='PGK'?q.labels.filter(l=>x.includes(l)===q.ans.includes(l)).length/q.labels.length:q.ans.filter((v,k)=>x[k]===v).length/q.ans.length;
const ready=(q,x)=>q.type==='PG'?!!x:q.type==='PGK'?x.length>0:x.every(v=>v!==null);
const keytxt=q=>q.type==='PG'?q.ans:q.type==='PGK'?q.ans.join(', '):q.ans.map((v,k)=>`${k+1} ${v?'Benar':'Salah'}`).join(', ');
const head=q=>`<div class="tags"><span class="pill" style="--c:${TY[q.type][1]}">${TY[q.type][0]}</span><span class="sub">Kompetensi ${q.k} · Sub ${q.sub}</span></div>`;
function opts(q,st,lk){const x=st.sel;
 if(q.type==='Benar-Salah')return '<div>'+q.opts.map((o,k)=>{const v=x[k],ok=q.ans[k],b=(val,t)=>`<button class="tf ${v===val?'on':''} ${lk&&val===ok?'key':''}" data-act="bs" data-k="${k}" data-v="${val}" ${lk?'disabled':''}>${t}</button>`;
  return `<div class="row ${lk?(v===ok?'ok':'bad'):''}"><span class="nm">${k+1}</span><div class="tx">${o}${lk?`<small class="kk">${v===ok?'✅':'❌'} Kunci: ${ok?'Benar':'Salah'}</small>`:''}</div><div class="tfs">${b(true,'Benar')}${b(false,'Salah')}</div></div>`}).join('')+'</div>';
 return '<div>'+q.opts.map((o,k)=>{const l=q.labels[k],on=q.type==='PG'?x===l:x.includes(l),r=q.ans.includes(l),c=lk?(r&&on?'ok':r?'miss':on?'bad':''):(on?'on':'');
  return `<button class="opt ${c}" data-act="opt" data-l="${l}" ${lk?'disabled':''}><span class="lb">${l}</span><span>${o}</span>${lk&&r?'<em>✓</em>':lk&&on?'<em>✗</em>':''}</button>`}).join('')+'</div>'}
const react=st=>{const r=st.r;return `<div class="react ${r.lv}"><div class="em">${r.em}</div><div><b>${r.t}</b><p>${r.lv==='good'?'Jawabanmu tepat! +1 poin 🎯':r.lv==='mid'?`Sebagian jawabanmu benar (+${+st.s.toFixed(2)} poin). Lihat tanda hijau &amp; merah di atas.`:'Jawaban yang benar sudah ditandai hijau. Pembahasan lengkap ada di akhir, ya!'}</p></div></div>`};
function start(){app.innerHTML=`<section class="card hero enter"><div class="mascot">🦉</div><h1>Latihan Soal TKA</h1><p><b>Bahasa Indonesia</b> · ${N} soal seru</p><div class="how"><div>🔘 <b>Pilihan Ganda</b> — pilih 1 jawaban yang paling tepat</div><div>☑️ <b>Pilihan Ganda Kompleks</b> — pilih semua jawaban yang benar</div><div>✅ <b>Benar / Salah</b> — tentukan tiap pernyataan</div><div>⭐ Setiap jawaban langsung ada reaksinya. Nilai &amp; pembahasan lengkap muncul di akhir!</div></div><button class="btn" data-act="go1">Mulai Petualangan 🚀</button></section>`}
function quiz(f){const q=Q[S.i],st=S.a[q.id],lk=st.done,pts=Q.reduce((s,x)=>s+S.a[x.id].s,0);
 app.innerHTML=`<header class="top"><div class="bar"><i style="width:${(S.i+(lk?1:0))/N*100}%"></i></div><div class="meta"><b>Soal ${S.i+1}<span>/${N}</span></b><i class="sp"></i><span class="chip">⭐ ${+pts.toFixed(1)}</span><span class="chip">🔥 ${S.streak}</span></div></header><main class="card ${f?'enter':''} ${S.shake?'shake':''}">${head(q)}${q.pass?`<div class="ps">${q.pass}</div>`:''}<div class="qt">${q.q}</div>${opts(q,st,lk)}${lk?react(st):''}<button class="btn" data-act="${lk?'next':'check'}" ${!lk&&!ready(q,st.sel)?'disabled':''}>${lk?(S.i===N-1?'Lihat Hasil 🏆':'Lanjut ➜'):'Periksa Jawaban ✔️'}</button></main>`}
const rev=q=>{const st=S.a[q.id],lv=st.s===1?'good':st.s===0?'bad':'mid';
 return `<article class="card rv ${lv}"><div class="rvh"><span>Soal ${q.id}</span><span class="badge ${lv}">${{good:'✅ Benar',mid:'🟡 Sebagian benar',bad:'❌ Belum tepat'}[lv]}</span></div>${head(q)}${q.pass?`<details><summary>📖 Lihat teks soal</summary><div class="ps">${q.pass}</div></details>`:''}<div class="qt">${q.q}</div>${opts(q,st,true)}<div class="exp"><h3>💡 Pembahasan</h3><p class="keyline">Kunci: ${keytxt(q)}</p>${q.exp}</div></article>`};
function fill(){document.querySelectorAll('.filt button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.f));$('#rl').innerHTML=Q.filter(q=>S.f==='all'||S.a[q.id].s<1).map(rev).join('')||'<div class="card hero"><div class="mascot">🎉</div><h2>Semua jawabanmu benar!</h2></div>'}
function result(){const sc=Q.map(q=>S.a[q.id].s),pct=Math.round(sc.reduce((a,b)=>a+b,0)/N*100),full=sc.filter(x=>x===1).length,zero=sc.filter(x=>x===0).length;
 const T=pct>=90?['🏆','Luar Biasa!','Kamu juara sejati! Pertahankan ya.']:pct>=75?['🌟','Keren Sekali!','Hasil yang sangat baik, sedikit lagi sempurna.']:pct>=60?['💪','Bagus, Terus Berlatih!','Pelajari pembahasan di bawah untuk naik level.']:['🌱','Jangan Menyerah!','Setiap latihan membuatmu lebih kuat. Baca pembahasannya, lalu coba lagi!'];
 const ks=[...new Set(Q.map(q=>q.k))].map(k=>{const g=Q.filter(q=>q.k===k),v=g.reduce((s,q)=>s+S.a[q.id].s,0)/g.length*100;return `<div><small><span>Kompetensi ${k}: ${g[0].kt}</span><span>${Math.round(v)}%</span></small><i><u style="width:${v}%"></u></i></div>`}).join('');
 app.innerHTML=`<section class="card hero enter"><div class="mascot">${T[0]}</div><h1>${T[1]}</h1><p>${T[2]}</p><div class="ring" style="--p:${pct}"><div><b>${pct}</b><small>nilai dari 100</small></div></div><div class="stats"><span class="badge good">✅ ${full} benar penuh</span><span class="badge mid">🟡 ${N-full-zero} sebagian</span><span class="badge bad">❌ ${zero} salah</span></div><div class="kb">${ks}</div><div class="cta"><button class="btn" data-act="again">🔄 Main Lagi</button><button class="btn ghost" data-act="rv">📚 Lihat Pembahasan</button></div></section><section id="pb"><h2 style="margin:24px 0 4px">📚 Pembahasan</h2><div class="filt"><button data-act="f" data-v="all">Semua soal</button><button data-act="f" data-v="bad">Yang belum sempurna</button></div><div id="rl"></div></section>`;fill();if(pct>=60)confetti()}
function confetti(){const c=document.createElement('div');c.className='conf';for(let i=0;i<40;i++){const s=document.createElement('i');s.style.cssText=`left:${Math.random()*100}%;background:hsl(${Math.random()*360} 90% 60%);animation-delay:${Math.random()*.4}s;--x:${(Math.random()-.5)*220}px`;c.append(s)}document.body.append(c);setTimeout(()=>c.remove(),2700)}
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const q=Q[S.i],st=S.a[q.id],d=b.dataset;
 switch(d.act){
 case'go1':S.scr='quiz';quiz(1);scrollTo(0,0);break;
 case'opt':if(st.done)break;st.sel=q.type==='PG'?d.l:st.sel.includes(d.l)?st.sel.filter(x=>x!==d.l):[...st.sel,d.l];quiz();break;
 case'bs':if(st.done)break;st.sel[+d.k]=d.v==='true';quiz();break;
 case'check':{st.s=score(q,st.sel);st.done=true;const lv=st.s===1?'good':st.s===0?'bad':'mid',m=pick(MSG[lv]);st.r={lv,em:m[0],t:m[1]};S.streak=lv==='good'?S.streak+1:0;S.shake=lv==='bad';quiz();S.shake=false;if(lv==='good')confetti();$('.react').scrollIntoView({block:'center',behavior:'smooth'});break}
 case'next':if(S.i<N-1){S.i++;quiz(1)}else{S.scr='res';result()}scrollTo(0,0);break;
 case'again':init();S.scr='quiz';quiz(1);scrollTo(0,0);break;
 case'rv':$('#pb').scrollIntoView();break;
 case'f':S.f=d.v;fill();break}});
init();start();
</script>
</body>
